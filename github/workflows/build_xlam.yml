name: Build ExcelSmart Pro XLAM

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight - show repo tree
        shell: pwsh
        run: |
          Write-Host "=== ROOT ==="
          Get-ChildItem -Force
          Write-Host "=== SRC TREE ==="
          Get-ChildItem -Recurse ./src | Select-Object FullName
          if (!(Test-Path "./src/ExcelSmartPro.xlam")) { throw "Missing ./src/ExcelSmartPro.xlam" }
          if (!(Test-Path "./src/ExcelSmartPro.xlam/XMLsource")) { throw "Missing XMLsource folder" }
          if (!(Test-Path "./src/ExcelSmartPro.xlam/Modules")) { throw "Missing Modules folder" }

      - name: Setup VBA runtime
        uses: DecimalTurn/setup-vba@v0.3.0
        with:
          office-apps: Excel
          install-office: true
          office-language: en-US

      - name: Build VBA-enabled documents
        uses: DecimalTurn/VBA-Build@v2.0.0
        with:
          source-dir: ./src
        timeout-minutes: 20

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExcelSmartPro-XLAM
          path: ./src/out/*
          if-no-files-found: error
